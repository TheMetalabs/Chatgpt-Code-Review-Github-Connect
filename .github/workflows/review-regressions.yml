name: Review regressions

on:
  pull_request:
  push:
    branches: [fix/review-wait-parse-heartbeat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source revision for reproduction
        run: git archive --format=zip HEAD -o /tmp/review-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-${{ github.sha }}
          path: /tmp/review-source.zip
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run build:dev
        if: ${{ !cancelled() }}
  review-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium for controlled browser fixtures
        run: npx playwright install --with-deps chromium
      - name: Lifecycle and Local HTTP regressions
        run: node --test tests/review/lifecycle.test.mjs tests/review/local.test.mjs
      - name: Chromium DOM regressions
        if: ${{ !cancelled() }}
        run: node --test tests/review/browser.e2e.mjs
      - name: MV3 and application integration fixtures
        if: ${{ !cancelled() }}
        run: node --experimental-vm-modules --test tests/review/extension.e2e.mjs
