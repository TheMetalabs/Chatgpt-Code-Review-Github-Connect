name: Review regressions

on:
  pull_request:
  push:
    branches: [fix/review-wait-parse-heartbeat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Independent of legacy template tests; requires no npm dependencies or LLM spend.
      - run: npm run test:review-regressions
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source revision for reproduction
        run: git archive --format=zip HEAD -o /tmp/review-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-${{ github.sha }}
          path: /tmp/review-source.zip
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        id: dependencies
      - run: npm test
      - name: Run library suites even when legacy script tests fail
        run: npm run test:lib
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run build:dev
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
  review-browser:
    runs-on: ubuntu-latest
    # Fixture execution is bounded; production queue/generation is not.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium for controlled browser fixtures
        id: browser
        run: npx playwright install --with-deps chromium
      - name: Chromium DOM regressions
        run: node --experimental-strip-types --test tests/review/browser.e2e.mjs
      - name: MV3 and application integration fixtures
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node --experimental-vm-modules --test tests/review/extension.e2e.mjs
