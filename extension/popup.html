<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />

  <body>
    <h1>Ashlar bridge</h1>
    <p class="muted">Same Chrome where ChatGPT or Grok is signed in. Polls Ashlar and sends the review prompt.</p>

    <script src="popup.js"></script>
  </body>
